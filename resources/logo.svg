<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Easy Midi Composer icon</title>
  <desc id="desc">Icon with piano keys, piano-roll grid, playhead and MIDI notes.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#243140"/>
      <stop offset="100%" stop-color="#111A24"/>
    </linearGradient>
    <linearGradient id="noteBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#43D4F2"/>
      <stop offset="100%" stop-color="#22B8DF"/>
    </linearGradient>
    <linearGradient id="noteGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5C95B"/>
      <stop offset="100%" stop-color="#E4A93A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="42" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <g opacity="0.95">

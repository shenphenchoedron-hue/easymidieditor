name: Build

# Builds on every push/PR. Pushing a tag like v0.1.0 also creates a GitHub Release
# with the binaries attached.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: MIDI-Composer-Windows-x64
          - name: macOS (Universal - Intel + Apple Silicon)
            os: macos-14
            artifact: MIDI-Composer-macOS-Universal
            cmake_extra: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          - name: Ubuntu
            os: ubuntu-22.04
            artifact: MIDI-Composer-Ubuntu-x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxext-dev libxcomposite-dev libgtk-3-dev \
            libgl1-mesa-dev

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps/juce-src
          key: juce-8.0.4-${{ runner.os }}

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: bash
        run: |
          ART=build/src/app/MidiComposer_artefacts/Release
          mkdir -p dist
          if [ "$RUNNER_OS" == "Windows" ]; then
            7z a "dist/${{ matrix.artifact }}.zip" "./$ART/MIDI Composer.exe" "./$ART/GeneralUser-GS.sf2" "./$ART/GeneralUser-GS-LICENSE.txt" "./$ART/MIDI-Composer-Manual.pdf" README.md LICENSE
          elif [ "$RUNNER_OS" == "macOS" ]; then
            lipo -info "$ART/MIDI Composer.app/Contents/MacOS/MIDI Composer"
            test -f "$ART/MIDI Composer.app/Contents/Resources/GeneralUser-GS.sf2"
            test -f "$ART/MIDI Composer.app/Contents/Resources/MIDI-Composer-Manual.pdf"
            ditto -c -k --keepParent "$ART/MIDI Composer.app" "dist/${{ matrix.artifact }}.zip"
          else
            mkdir -p pkg/MIDI-Composer
            cp "$ART/MIDI Composer" "$ART/GeneralUser-GS.sf2" "$ART/GeneralUser-GS-LICENSE.txt" "$ART/MIDI-Composer-Manual.pdf" README.md LICENSE pkg/MIDI-Composer/
            cp resources/icon.png pkg/MIDI-Composer/
            tar -czf "dist/${{ matrix.artifact }}.tar.gz" -C pkg MIDI-Composer
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  debian:
    name: Debian 12 (.deb)
    runs-on: ubuntu-latest
    container: debian:12
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y git build-essential cmake pkg-config dpkg-dev \
            libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxext-dev libxcomposite-dev libgtk-3-dev \
            libgl1-mesa-dev
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4
          ctest --test-dir build --output-on-failure
      - name: Package .deb
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME}"; else VERSION="0.0.0~git${GITHUB_SHA::7}"; fi
          scripts/make-deb.sh "$VERSION" dist
      - uses: actions/upload-artifact@v4
        with:
          name: MIDI-Composer-Debian-deb
          path: dist/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, debian]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Add manuals (English + Danish)
        run: cp docs/MIDI-Composer-Manual.pdf docs/MIDI-Composer-Manual-da.pdf dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
